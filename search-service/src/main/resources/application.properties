spring.config.import=classpath:/shared.properties

spring.r2dbc.url=r2dbc:pool:postgresql://localhost/stellio_search
spring.r2dbc.username=stellio
spring.r2dbc.password=stellio_password

# Required for Flyway to know where the DB is located
spring.flyway.url = jdbc:postgresql://localhost/stellio_search
spring.flyway.user = ${spring.r2dbc.username}
spring.flyway.password = ${spring.r2dbc.password}

server.port = 8083

search.on-owner-delete-cascade-entities = false
# by default, bucket start times are aligned at 00:00:00UTC
# https://docs.timescale.com/use-timescale/latest/time-buckets/about-time-buckets/#timezones
# this property allows to align them different timezones which is useful for weekly or monthly aggregates for instance
search.timezone-for-time-buckets = GMT

# https://opentelemetry.io/docs/specs/semconv/registry/attributes/service/#service-name
management.opentelemetry.resource-attributes.service.name = search-service

# interval, in milliseconds, between two runs of the periodic garbage collection of expired entities and attributes
search.transient-data.gc.interval = 0 0 * * * *

# interval between two probes of the Kafka cluster, and timeout of a probe; while Kafka is detected as unavailable,
# write requests are rejected so that no entity event is lost
search.kafka-health.interval = 5s
search.kafka-health.timeout = 2s

# Kafka producer tuning for entity events (see KafkaHealthService): retry a send for up to 10 minutes to ride out
# short outages and the detection window, and keep enough buffer for the events produced until writes are rejected.
# The client drops the topic metadata once the broker is gone, so a send also waits up to 10 minutes for it; this only
# holds the single event sender, the next events queue up behind it in order
spring.kafka.producer.properties[delivery.timeout.ms] = 600000
spring.kafka.producer.buffer-memory = 64MB
spring.kafka.producer.properties[max.block.ms] = 600000
